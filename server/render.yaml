services:
  - type: web
    name: syllabrix-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # ── Database (Aiven) ─────────────────────────────
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_CONNECTION_LIMIT
        value: "5"
      # ── Auth ─────────────────────────────────────────
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 7d
      # ── Cloudinary ───────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: prod
      # ── Email ────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # ── AI Keys ──────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      # ── Client URL ───────────────────────────────────
      - key: CLIENT_URL
        sync: false
